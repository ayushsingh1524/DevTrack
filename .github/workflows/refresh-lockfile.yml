name: Refresh frontend lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stabilize-devtrack
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: frontend
        run: npm install --package-lock-only
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): refresh npm lockfile"
          git push origin HEAD:fix/stabilize-devtrack
